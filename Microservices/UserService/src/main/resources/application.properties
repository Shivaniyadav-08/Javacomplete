spring.application.name=USERSERVICE

server.port=8081
spring.config.import= optional:configserver:http://localhost:8086


spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#<------------------------------------------------------------------------------------>

#This allows Spring Boot Actuator to expose circuit breaker status (like UP, DOWN, OPEN, CLOSED) when you hit the /actuator/health endpoint.
management.health.circuitbreakers.enabled=true

#Tells Spring Boot to expose only the /actuator/health endpoint over the web.
management.endpoints.web.exposure.include=health

#This config forces detailed health info to always show in the /actuator/health endpoint.
management.endpoint.health.show-details=always


resilience4j.circuitbreaker.instances.ratingHotelBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.ratingHotelBreaker.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.ratingHotelBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.ratingHotelBreaker.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.ratingHotelBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.ratingHotelBreaker.waitDurationInOpenState=6s
resilience4j.circuitbreaker.instances.ratingHotelBreaker.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.ratingHotelBreaker.slidingWindowType=COUNT_BASED

resilience4j.retry.instances.ratingHotelBreaker.max-attempts= 3
resilience4j.retry.instances.ratingHotelBreaker.wait-duration=5s

resilience4j.ratelimiter.instances.UserRateLimiter.limit-refresh-period= 4s
resilience4j.ratelimiter.instances.UserRateLimiter.limit-for-period=2
resilience4j.ratelimiter.instances.UserRateLimiter.time-out-duration=2s


